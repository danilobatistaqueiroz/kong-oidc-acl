services:
    oidc-redis:
      image: redis:latest
      networks:
      - kong-net
      ports:
      - 6379:6379
      environment:
        REDIS_PORT: 6379
      volumes:
      - ./kong/redis/dаta:/root/redis
      #- ./kong/redis/redis.conf:/usr/local/etc/redis/redis.conf

    kong-database:
      image: postgres:9.6
      environment:
        POSTGRES_USER: kong
        POSTGRES_PASSWORD: kong
        POSTGRES_DB: kong
        #POSTGRES_USERS: ${KONG_DB_USERNAME}:${KONG_DB_PASSWORD}|${KONGA_DB_USERNAME}:${KONGA_DB_PASSWORD}
        #POSTGRES_DATABASES: ${KONG_DB_NAME}:${KONG_DB_USERNAME}|${KONGA_DB_NAME}:${KONGA_DB_USERNAME}
      volumes:
       - ./kong/db/data:/var/lib/postgresql/data
      networks:
      - kong-net
      ports:
      - 5432:5432
      healthcheck:
        test: ["CMD", "pg_isready", "-U", "kong"]
        interval: 5s
        timeout: 5s
        retries: 5

    kong-migrations:
      image: kong:latest
      entrypoint: sh -c "sleep 10 && kong migrations bootstrap -v"
      environment:
        KONG_DATABASE: postgres
        KONG_PG_HOST: kong-database
        #KONG_PG_DATABASE: ${KONG_DB_NAME}
        #KONG_PG_USER: ${KONG_DB_USERNAME}
        KONG_PG_PASSWORD: kong
        KONG_PASSWORD: kong
      depends_on:
      - kong-database
      links:
      - kong-database
      networks:
      - kong-net
      restart: on-failure

    kong-gateway:
      image: kong-devto:latest
      environment:
        KONG_DATABASE: postgres
        KONG_PG_HOST: kong-database
        KONG_PG_USER: kong
        KONG_PG_PASSWORD: kong
        KONG_PROXY_ACCESS_LOG: "/dev/stdout"
        KONG_ADMIN_ACCESS_LOG: "/dev/stdout"
        KONG_PROXY_ERROR_LOG: "/dev/stderr"
        KONG_ADMIN_ERROR_LOG: "/dev/stderr"
        KONG_ADMIN_LISTEN: "0.0.0.0:8001"
        KONG_ADMIN_GUI_URL: "http://localhost:8002"
        KONG_PLUGINS: "bundled,oidc"
        KONG_LOG_LEVEL: "info" # "debug","info","warn","error","crit"
      restart: on-failure
      ports:
      - 8000:8000 # Data plane node port (Takes incoming HTTP traffic from Consumers, and forwards it to upstream Services.)
      - 8443:8443 # Data plane node port (Takes incoming HTTPS traffic from Consumers, and forwards it to upstream Services.)
      - 8001:8001 # Admin API. Listens for calls from the command line over HTTP. 
      - 8444:8444 # Admin API. Listens for calls from the command line over HTTPS. 
      - 8002:8002 # Kong Manager (GUI). Listens for HTTP traffic.
      - 8445:8445 # Kong Manager (GUI). Listens for HTTPS traffic.
      - 8003:8003
      - 8004:8004
      networks:
      - kong-net
      depends_on:
      - kong-migrations
      - kong-database
      - oidc-redis
      healthcheck:
        test: ["CMD", "curl", "-f", "http://kong-gateway:8001"]
        interval: 5s
        timeout: 2s
        retries: 15

    konga-prepare:
      image: pantsel/konga:next
      command: "-c prepare -a postgres -u postgresql://kong:kong@kong-database:5432/konga_db"
      environment:
        DB_ADAPTER: postgres
        DB_HOST: kong-database
        DB_USER: kong
        DB_PASSWORD: kong
      networks:
      - kong-net
      restart: on-failure
      links:
      - kong-database
      depends_on:
      - kong-database

    konga:
      image: pantsel/konga
      environment:
        TOKEN_SECRET: km1GUr4RkcQD7DewhJPNXrCuZwcKmqjb
        DB_ADAPTER: postgres
        DB_HOST: kong-database
        DB_PORT: 5432
        DB_USER: kong
        DB_PASSWORD: kong
        DB_DATABASE: kong
        NODE_ENV: development
        KONGA_HOOK_TIMEOUT: 10000
      restart: on-failure
      ports:
      - 1337:1337
      depends_on:
      - kong-gateway
      networks:
      - kong-net

    estoque:
      container_name: estoque
      build:
        context: ./estoque
        target: development
      volumes:
        - ./estoque:/usr/src/app
        - /usr/src/app/node_modules
      ports:
        - ${ESTOQUE_PORT}:${ESTOQUE_PORT}
        - 9229:9229
      command: npm run start:dev
      env_file:
        - .env
      networks:
        - kong-net


    keycloakweb:
      image: mykeycloak
      restart: on-failure
      ports:
        - "18080:18080"
        - "18443:18443"
        - "19000:19000"
      environment:
        KC_BOOTSTRAP_ADMIN_PASSWORD: admin
        KC_BOOTSTRAP_ADMIN_USERNAME: admin
        DB_VENDOR: postgres
        DB_USER: root
        DB_PASSWORD: electron
        KC_DB_URL: "jdbc:postgresql://keycloakdb:15432/keycloak"
        KC_DB: postgres
        KC_DB_USERNAME: keycloak
        KC_DB_PASSWORD: electron
        KC_HOSTNAME: "https://keycloakweb:18443"
        KC_HOSTNAME_ADMIN: "https://keycloakweb:18443"
        KEYCLOAK_FRONTEND_URL: "http://keycloakweb/auth"
        KC_HTTP_PORT: 18080
        KC_HTTPS_PORT: 18443
        KC_HTTP_MANAGEMENT_PORT: 19000
      volumes:
        - ./keycloak/conf/keycloak.conf:/opt/keycloak/conf/keycloak.conf
      networks:
        - kong-net

    keycloakdb:
      image: postgres:latest
      restart: on-failure
      environment:
        POSTGRES_DB: keycloak
        POSTGRES_USER: keycloak
        POSTGRES_PASSWORD: electron
        PGPORT: 15432
      ports:
        - "15432:15432"
      volumes:
        - ./keycloak/postgres_data:/var/lib/postgresql/data
      networks:
        - kong-net

networks:
  kong-net:
    driver: bridge